{% macro icon(sentiment) %}{% set mood='positive' if sentiment=='Pozitívny' else 'negative' if sentiment=='Negatívny' else 'neutral' if sentiment=='Neutrálny' else 'unknown' %}<svg class="mood-icon mood-icon--{{ mood }}" viewBox="0 0 48 48" width="24" height="24" aria-hidden="true" focusable="false"><circle cx="24" cy="24" r="22" fill="{{ '#4ADE80' if mood=='positive' else '#FF6B6B' if mood=='negative' else '#FFD43B' if mood=='neutral' else '#CBD5E1' }}" stroke="#0F172A" stroke-width="2"/>{% if mood=='positive' %}<ellipse cx="16.5" cy="18" rx="2.7" ry="3.6" fill="#0F172A"/><ellipse cx="31.5" cy="18" rx="2.7" ry="3.6" fill="#0F172A"/><path d="M12.5 25.5h23c0 6.8-5.1 11.8-11.5 11.8S12.5 32.3 12.5 25.5z" fill="#0F172A"/><path d="M17.6 33.6c1.7-2 3.9-3 6.4-3s4.7 1 6.4 3c-1.8 1.6-4 2.5-6.4 2.5s-4.6-.9-6.4-2.5z" fill="#FF7A8A"/><circle cx="10.5" cy="25" r="3" fill="#FF7A8A" opacity=".55"/><circle cx="37.5" cy="25" r="3" fill="#FF7A8A" opacity=".55"/>{% elif mood=='negative' %}<ellipse cx="16.5" cy="20.5" rx="2.7" ry="3.6" fill="#0F172A"/><ellipse cx="31.5" cy="20.5" rx="2.7" ry="3.6" fill="#0F172A"/><path d="M11.8 13.2l7.4 2.8M36.2 13.2l-7.4 2.8" fill="none" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round"/><path d="M14.8 35.6c2.4-4.8 5.6-7.2 9.2-7.2s6.8 2.4 9.2 7.2" fill="none" stroke="#0F172A" stroke-width="3.4" stroke-linecap="round"/>{% elif mood=='neutral' %}<ellipse cx="16.5" cy="19.5" rx="2.7" ry="3.6" fill="#0F172A"/><ellipse cx="31.5" cy="19.5" rx="2.7" ry="3.6" fill="#0F172A"/><path d="M12.5 12.8h7M28.5 12.8h7" fill="none" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round"/><path d="M15.5 31.5h17" fill="none" stroke="#0F172A" stroke-width="3.4" stroke-linecap="round"/>{% else %}<ellipse cx="16.5" cy="19.5" rx="2.7" ry="3.6" fill="#0F172A"/><ellipse cx="31.5" cy="19.5" rx="2.7" ry="3.6" fill="#0F172A"/><path d="M18 31.5h12" fill="none" stroke="#0F172A" stroke-width="3.4" stroke-linecap="round"/>{% endif %}</svg>{% endmacro %}
{% macro ui(name) %}<svg class="ui-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">{% if name=='search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/>{% elif name=='play' %}<path d="M7 4.8v14.4c0 .8.9 1.3 1.6.9l11.3-7.2c.6-.4.6-1.3 0-1.7L8.6 3.9C7.9 3.5 7 4 7 4.8z" fill="currentColor" stroke="none"/>{% elif name=='pause' %}<rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none"/>{% elif name=='previous' %}<rect x="4" y="5" width="3.6" height="14" rx="1.2" fill="currentColor" stroke="none"/><path d="M18.4 5.6c.7-.5 1.6 0 1.6.8v11.2c0 .8-.9 1.3-1.6.8l-8.2-5.6c-.6-.4-.6-1.3 0-1.7z" fill="currentColor" stroke="none"/>{% elif name=='next' %}<rect x="16.4" y="5" width="3.6" height="14" rx="1.2" fill="currentColor" stroke="none"/><path d="M5.6 5.6c-.7-.5-1.6 0-1.6.8v11.2c0 .8.9 1.3 1.6.8l8.2-5.6c.6-.4.6-1.3 0-1.7z" fill="currentColor" stroke="none"/>{% elif name=='clock' %}<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>{% elif name=='headphones' %}<path d="M4 15.5V12a8 8 0 0 1 16 0v3.5"/><rect x="3.5" y="14" width="4.2" height="6.5" rx="1.6"/><rect x="16.3" y="14" width="4.2" height="6.5" rx="1.6"/>{% elif name=='sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M5.5 18.5L7 17M17 7l1.5-1.5"/>{% elif name=='moon' %}<path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/>{% elif name=='sliders' %}<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>{% elif name=='alert' %}<path d="M12 3.8l8.8 15.4H3.2z"/><path d="M12 10v4.2M12 17h.01"/>{% elif name=='transcript' %}<path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4M9.8 12h5.4M9.8 15.5h5.4"/>{% endif %}</svg>{% endmacro %}
